{% load static %}  <!-- Carregar tags estáticas -->

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Minha Aplicação{% endblock %}</title>
    
    <!-- Font Awesome para ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    
    <!-- Estilo personalizado -->
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">  

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            display: flex;
            min-height: 100vh;
        }

        header {
            width: 220px;
            background-color: #202020;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            padding: 20px;
            border-radius: 0 20px 20px 0;
        }

        header h1 {
            font-size: 20px;
            margin-bottom: 30px;
            text-align: center;
            width: 100%;
        }

        nav ul {
            list-style: none;
            padding: 0;
            margin: 0;
            width: 100%;
            display: flex;
            flex-direction: column;
        }

        nav li {
            margin: 15px 0;
        }

        nav a {
            color: white;
            text-decoration: none;
            font-size: 16px;
            display: flex;
            align-items: center;
            padding: 10px;
            border-radius: 8px;
        }

        nav a:hover {
            background-color: #333;
        }

        nav a i {
            margin-right: 10px;
        }

        form {
            margin-top: auto;
            width: 100%;
        }

        form button {
            width: 100%;
            padding: 10px;
            background-color: #444;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }

        form button:hover {
            background-color: #666;
        }

        main {
            flex: 1;
            padding: 40px;
            background-color: #f2f2f2;
        }

    </style>
</head>
<body>

    <!-- Barra lateral -->
    <header>
        <h1>Sistema de mercado</h1>
        <nav>
            <ul>
                <li><a href="{% url 'index' %}"><i class="fas fa-home"></i>Início</a></li>
                <li><a href="{% url 'produtos_usuario' %}"><i class="fas fa-box"></i>Adicionar Produtos</a></li>
                <li><a href="{% url 'carrinho' %}"><i class="fas fa-shopping-cart"></i>Meu Carrinho</a></li>
            </ul>
        </nav>

        {% if user.is_authenticated %}
            <form action="{% url 'logout' %}" method="POST">
                {% csrf_token %}
                <button type="submit"><i class="fas fa-sign-out-alt"></i> Logout</button>
            </form>
        {% endif %}
    </header>

    <!-- Conteúdo principal -->
    <main>
        {% block content %} 
        {% endblock %}
    </main>

    <!-- Scripts -->
    <script src="{% static 'js/scripts.js' %}"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
